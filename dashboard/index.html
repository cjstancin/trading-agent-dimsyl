<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bull · Paper Trading</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --alab:#f6f2e9;--card:#fbf9f2;--ink:#1a160e;--mut:#6d6452;--dim:#928974;--line:rgba(120,100,50,.18);
    --gold:#b8932f;--gold2:#d8b659;--goldlt:#efd98e;--goldd:#8a6c22;
    --emer:#1f8a5a;--emerbg:rgba(31,138,90,.12);--ruby:#b3263b;--rubybg:rgba(179,38,59,.12);--amber:#b07d18;
    --disp:'Cinzel',Georgia,serif;--num:'Fraunces',Georgia,serif;--body:'EB Garamond',Georgia,serif;
    --clip:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  }
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{color:var(--ink);font:16px/1.5 var(--body);min-height:100vh;overflow-x:hidden;
    background:
      linear-gradient(135deg,rgba(255,255,255,.6),transparent 38%),
      linear-gradient(312deg,rgba(214,206,184,.55),transparent 42%),
      repeating-linear-gradient(26deg,rgba(255,255,255,.04) 0 2px,transparent 2px 26px),
      #efe8d8 fixed}
  .facets{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background:conic-gradient(from 200deg at 18% 12%,rgba(255,255,255,.5),transparent 25%,rgba(210,200,176,.4) 50%,transparent 75%),conic-gradient(from 40deg at 84% 80%,rgba(255,255,255,.45),transparent 30%,rgba(205,194,168,.35) 60%,transparent 85%);mix-blend-mode:soft-light}
  .wrap{position:relative;z-index:2;max-width:1260px;margin:0 auto;padding:28px 26px 46px}
  header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px;
    border-bottom:1px solid var(--line);padding-bottom:16px}
  .brand{display:flex;align-items:center;gap:14px}
  .mark{font-size:22px;color:var(--gold);transform:rotate(0deg)}
  .title{font-family:var(--disp);font-size:26px;font-weight:700;letter-spacing:3px;text-transform:uppercase}
  .subtitle{font-size:13px;color:var(--mut);letter-spacing:.5px}
  .hmeta{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .pill{font-family:var(--disp);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;padding:6px 12px;color:var(--goldd);
    background:var(--card);border:1px solid var(--gold);clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
  .pill.warn{color:var(--amber);border-color:var(--amber)}
  .live{display:inline-flex;align-items:center;gap:8px;font-family:var(--disp);font-size:11px;letter-spacing:1.2px;color:var(--emer);text-transform:uppercase}
  .gem{width:13px;height:13px;background:linear-gradient(135deg,#5fe0b0,#1f8a5a 55%,#0c5e3c);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);box-shadow:0 0 0 1px rgba(31,138,90,.3);animation:facetflash 3.4s steps(1) infinite}
  @keyframes facetflash{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
  .reload{cursor:pointer}
  nav.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .tab{font-family:var(--disp);font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:9px 16px;color:var(--mut);
    background:var(--card);border:1px solid var(--line);cursor:pointer;transition:none;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
  .tab:hover{color:var(--ink);border-color:var(--gold)}
  .tab.active{color:var(--goldd);border-color:var(--gold);background:linear-gradient(180deg,#fffdf6,#f3ecda)}
  .card{position:relative;background:var(--card);padding:17px 19px;clip-path:var(--clip);transition:transform .07s linear}
  .card::before{content:'';position:absolute;inset:-1.5px;z-index:-1;clip-path:var(--clip);
    background:linear-gradient(115deg,#8a6c22,#e7cd7e 16%,#b8932f 32%,#f5e6ac 50%,#b8932f 68%,#e7cd7e 84%,#8a6c22);
    background-size:340% 100%;animation:goldflow 11s linear infinite}
  @keyframes goldflow{0%{background-position:0% 0}100%{background-position:340% 0}}
  .clk{cursor:pointer}.clk:hover{transform:translateY(-2px)}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
  .kpi .lab{font-family:var(--disp);font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:1.2px}
  .kpi .val{font-family:var(--num);font-size:28px;font-weight:600;margin-top:6px;line-height:1}
  .kpi .hint{position:absolute;top:15px;right:18px;font-size:11px;color:var(--dim)}
  .up{color:var(--emer)}.dn{color:var(--ruby)}.warnc{color:var(--amber)}.mut{color:var(--mut)}.dim{color:var(--dim)}.small{font-size:13px}
  .grid2{display:grid;grid-template-columns:1.05fr 1fr;gap:16px;margin-top:16px}
  .ctitle{display:flex;justify-content:space-between;align-items:center;font-family:var(--disp);font-size:12.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--goldd);margin-bottom:12px}
  .ctitle .hint{font-family:var(--body);font-size:12px;letter-spacing:0;text-transform:none;color:var(--dim)}
  .leg{display:flex;gap:8px;align-items:center;font-family:var(--body);font-size:12px;letter-spacing:0;text-transform:none;color:var(--mut)}.leg .d{width:14px;height:3px;display:inline-block}.d.blue{background:var(--gold)}.d.gray{background:#b0a890}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font-family:var(--disp);font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--goldd);text-align:right;padding:8px 10px;border-bottom:1.5px solid var(--gold)}
  th:first-child,td:first-child{text-align:left}td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line)}
  tbody tr{transition:none}tbody tr:hover{background:rgba(184,147,47,.08)}
  .tk{cursor:pointer;font-weight:600}.tk b{border-bottom:1px solid rgba(184,147,47,.5)}.tk:hover{color:var(--goldd)}
  .tag{font-family:var(--disp);font-size:9.5px;letter-spacing:.6px;color:var(--goldd);background:rgba(184,147,47,.14);padding:2px 7px;margin-left:6px;clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px)}
  .score{color:var(--goldd);font-weight:600}.mut{color:var(--mut)}
  .back{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--goldd);cursor:pointer;margin-bottom:14px}
  .tkhead{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:12px}
  .tkprice{font-family:var(--num);font-size:32px;font-weight:600}
  .tkmeta{display:flex;gap:22px;flex-wrap:wrap;margin:10px 0}.tkmeta .b{font-size:13px;color:var(--mut)}.tkmeta .b b{color:var(--ink);font-weight:600;font-size:16px;display:block;font-family:var(--num)}
  .lnk{font-family:var(--disp);font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--goldd);cursor:pointer;border-bottom:1px solid var(--gold)}
  .note{font-size:13px;color:var(--dim);margin:9px 2px}
  footer{color:var(--dim);font-size:12.5px;margin-top:26px;line-height:1.7;border-top:1px solid var(--line);padding-top:14px}
  .sample{font-family:var(--disp);font-size:10px;letter-spacing:1px;color:var(--amber);border:1px solid var(--amber);padding:2px 8px;margin-left:8px}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.wrap{padding:20px 16px 32px}}
</style>
</head>
<body>
<div class="facets"></div>
<div class="wrap">
  <header>
    <div class="brand"><span class="mark">◆</span>
      <div><div class="title">Bull</div><div class="subtitle">Paper trading · aggressive · <span id="updated">loading…</span></div></div></div>
    <div class="hmeta">
      <span class="live"><span class="gem"></span><span id="status">PAPER</span></span>
      <span class="pill" id="profile">Aggressive · Paper</span>
      <span class="pill warn" id="regime">Regime —</span>
      <span class="pill reload" id="reload">↻ Refresh</span>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="overview">Overview</button>
    <button class="tab" data-tab="positions">Positions</button>
    <button class="tab" data-tab="performance">Performance</button>
    <button class="tab" data-tab="signals">Signals</button>
    <button class="tab" data-tab="trades">Trades</button>
    <button class="tab" data-tab="market">Market</button>
  </nav>
  <div id="content"></div>
  <footer>Simulated money — Alpaca paper sandbox. No real funds. Educational, not financial advice; CJ owns every decision.<br>Published by the cloud routine to <code>data/status.json</code>. Read-only; no keys.</footer>
</div>
<script>
const F={usd:n=>n==null?'—':'$'+Math.round(n).toLocaleString(),usd2:n=>n==null?'—':'$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}),pct:n=>n==null?'—':(n>=0?'+':'')+Number(n).toFixed(1)+'%',cls:n=>n==null?'':(n>=0?'up':'dn')};
function spark(a,w,h,st){if(!a||!a.length)return '';const mn=Math.min(...a),mx=Math.max(...a),r=(mx-mn)||1;const pts=a.map((v,i)=>[(i/(a.length-1))*w,h-((v-mn)/r)*h]);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${st||'#b8932f'}" stroke-width="2.2"/></svg>`;}
function curve(d){const a=d.equityCurve||[],s=d.spyCurve||[];if(!a.length)return '<div class="note">No equity history yet.</div>';const W=600,H=150;const all=a.map(x=>x.v).concat(s.map(x=>x.v));const mn=Math.min(...all),mx=Math.max(...all),r=(mx-mn)||1;const map=arr=>arr.map((x,i)=>[(i/(arr.length-1))*W,H-((x.v-mn)/r)*H]);const path=p=>p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');const bp=map(a),sp=s.length?map(s):null;const area=path(bp)+` L${W},${H} L0,${H} Z`;return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none"><defs><linearGradient id="bf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8932f" stop-opacity=".2"/><stop offset="1" stop-color="#b8932f" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#bf)"/><path d="${path(bp)}" fill="none" stroke="#b8932f" stroke-width="2.4"/>${sp?`<path d="${path(sp)}" fill="none" stroke="#b0a890" stroke-width="1.5" stroke-dasharray="5 5"/>`:''}</svg>`;}
let DATA={};
function findTicker(sym){const p=(DATA.positions||[]).find(x=>x.ticker===sym);const g=(DATA.signals||[]).find(x=>x.ticker===sym);const t=(DATA.tickers||{})[sym]||{};return {sym,name:t.name||(p&&p.name)||sym,last:t.last??(p&&p.last),chgPct:t.chgPct??(p&&p.pnlPct),spark:t.spark||(p&&p.spark)||[],pos:p,sig:g,thesis:(p&&p.thesis)||(g&&g.thesis)||t.thesis||'No thesis on file.'};}
const V={
  overview(d){return `<section class="kpis">${kpi('Paper equity',F.usd(d.equity),null,'performance')}${kpi('Day P&L',F.pct(d.dayPnlPct),F.cls(d.dayPnlPct),'performance')}${kpi('Month P&L',F.pct(d.monthPnlPct),F.cls(d.monthPnlPct),'performance')}${kpi('vs S&P 500',F.pct(d.vsSpyPct),F.cls(d.vsSpyPct),'performance')}</section>
    <section class="card clk" data-go="performance"><div class="ctitle"><span>Equity curve</span><span class="leg"><i class="d blue"></i>Bull <i class="d gray"></i>S&P 500 <span class="hint">expand ›</span></span></div>${curve(d)}</section>
    <section class="grid2"><div class="card clk" data-go="positions"><div class="ctitle"><span>Top positions</span><span class="hint">expand ›</span></div><table><thead><tr><th>Ticker</th><th>% eq</th><th>P&L %</th></tr></thead><tbody>${(d.positions||[]).slice(0,5).map(p=>`<tr><td><span class="tk" data-tk="${p.ticker}"><b>${p.ticker}</b></span>${p.type?`<span class="tag">${p.type}</span>`:''}</td><td>${p.pctEq??'—'}%</td><td class="${F.cls(p.pnlPct)}">${F.pct(p.pnlPct)}</td></tr>`).join('')||emptyRow(3)}</tbody></table></div>
    <div class="card clk" data-go="signals"><div class="ctitle"><span>Signal queue</span><span class="hint">expand ›</span></div><table><thead><tr><th>Ticker</th><th>Score</th><th>Catalyst</th></tr></thead><tbody>${(d.signals||[]).slice(0,5).map(s=>`<tr><td><span class="tk" data-tk="${s.ticker}"><b>${s.ticker}</b></span></td><td class="score">${s.score??'—'}</td><td class="mut small">${s.catalyst||''}</td></tr>`).join('')||emptyRow(3)}</tbody></table></div></section>`;},
  positions(d){return back()+`<div class="card"><div class="ctitle"><span>All positions · full detail</span><span class="hint">${(d.positions||[]).length} open</span></div><table><thead><tr><th>Ticker</th><th>Qty</th><th>Entry</th><th>Stop</th><th>Last</th><th>Mkt $</th><th>% eq</th><th>P&L $</th><th>P&L %</th><th>Days</th></tr></thead><tbody>${(d.positions||[]).map(p=>`<tr><td><span class="tk" data-tk="${p.ticker}"><b>${p.ticker}</b></span>${p.type?`<span class="tag">${p.type}</span>`:''}</td><td>${p.qty??'—'}</td><td>${p.entry!=null?F.usd2(p.entry):'—'}</td><td>${p.stop??'—'}</td><td>${p.last!=null?F.usd2(p.last):'—'}</td><td>${F.usd(p.mktValue)}</td><td>${p.pctEq??'—'}%</td><td class="${F.cls(p.pnl)}">${p.pnl!=null?(p.pnl>=0?'+':'')+F.usd(Math.abs(p.pnl)):'—'}</td><td class="${F.cls(p.pnlPct)}">${F.pct(p.pnlPct)}</td><td>${p.days??'—'}</td></tr>`).join('')||emptyRow(10)}</tbody></table><div class="note">Click any ticker for its page.</div></div>`;},
  performance(d){const s=d.stats||{};return back()+`<div class="card"><div class="ctitle"><span>Performance vs S&P 500</span></div><section class="kpis" style="margin:4px 0 14px">${kpi('Win rate',s.winRate!=null?s.winRate+'%':'—')}${kpi('Max drawdown',s.maxDrawdownPct!=null?F.pct(s.maxDrawdownPct):'—',F.cls(s.maxDrawdownPct))}${kpi('Best day',s.bestDayPct!=null?F.pct(s.bestDayPct):'—','up')}${kpi('Sharpe',s.sharpe??'—')}</section><div class="ctitle"><span>Equity curve</span><span class="leg"><i class="d blue"></i>Bull <i class="d gray"></i>S&P 500</span></div>${curve(d)}<div class="note">Bull ${F.pct(d.vsSpyPct)} vs S&P since inception.</div></div>`;},
  signals(d){return back()+`<div class="card"><div class="ctitle"><span>Signal queue · candidates</span></div><table><thead><tr><th>Ticker</th><th>Dir</th><th>Score</th><th>Entry</th><th>Stop</th><th>Target</th><th>Size</th><th>Catalyst</th></tr></thead><tbody>${(d.signals||[]).map(s=>`<tr><td><span class="tk" data-tk="${s.ticker}"><b>${s.ticker}</b></span></td><td>${s.dir||'LONG'}</td><td class="score">${s.score??'—'}</td><td>${s.entry||'—'}</td><td>${s.stop||'—'}</td><td>${s.target||'—'}</td><td>${s.size||'—'}</td><td class="mut small">${s.catalyst||''}</td></tr>`).join('')||emptyRow(8)}</tbody></table></div>`;},
  trades(d){return back()+`<div class="card"><div class="ctitle"><span>Trade history + journal</span></div><table><thead><tr><th>Date</th><th>Ticker</th><th>Side</th><th>Qty</th><th>Price</th><th>Status</th><th>Realized</th><th>Grade</th><th>Note</th></tr></thead><tbody>${(d.trades||[]).map(t=>`<tr><td>${t.date}</td><td><span class="tk" data-tk="${t.ticker}"><b>${t.ticker}</b></span></td><td>${t.side}</td><td>${t.qty??'—'}</td><td>${t.price!=null?F.usd2(t.price):'—'}</td><td class="mut">${t.status||''}</td><td class="${F.cls(t.realized)}">${t.realized!=null?(t.realized>=0?'+':'')+F.usd(Math.abs(t.realized)):'—'}</td><td>${t.grade||'—'}</td><td class="mut small">${t.note||''}</td></tr>`).join('')||emptyRow(9)}</tbody></table></div>`;},
  market(d){const m=d.movers||{};const tbl=(title,arr)=>`<div class="card"><div class="ctitle"><span>${title}</span></div><table><thead><tr><th>Ticker</th><th>Chg</th><th>Volume</th></tr></thead><tbody>${(arr||[]).map(x=>`<tr><td><span class="tk" data-tk="${x.ticker}"><b>${x.ticker}</b></span></td><td class="${F.cls(x.chgPct)}">${F.pct(x.chgPct)}</td><td class="mut">${x.vol||'—'}</td></tr>`).join('')||emptyRow(3)}</tbody></table></div>`;return back()+`<section class="grid2">${tbl('Top risers',m.risers)}${tbl('Top fallers',m.fallers)}</section><section class="grid2" style="margin-top:16px">${tbl('Biggest names',m.biggest)}${tbl('Unusual volume',m.unusualVol)}</section>`;},
  ticker(sym){const t=findTicker(sym);return back()+`<div class="card"><div class="tkhead"><div><div class="ctitle" style="margin:0"><span>${t.sym} · ${t.name}</span></div><div class="tkprice ${F.cls(t.chgPct)}">${t.last!=null?F.usd2(t.last):'—'} <span style="font-size:15px">${t.chgPct!=null?F.pct(t.chgPct):''}</span></div></div><span class="hint">ticker page</span></div>${spark(t.spark,600,90,'#1f8a5a')||'<div class="note">No recent price series.</div>'}<div class="tkmeta">${t.pos?`<span class="b">Position<b>${t.pos.pctEq}% eq · ${F.pct(t.pos.pnlPct)}</b></span>`:'<span class="b">Position<b>not held</b></span>'}${t.pos?`<span class="b">Entry / stop<b>${F.usd2(t.pos.entry)} · ${t.pos.stop}</b></span>`:''}${t.sig?`<span class="b">Score<b>${t.sig.score}</b></span>`:''}</div><div class="note" style="font-size:14px;color:var(--ink)"><b>Thesis:</b> ${t.thesis}</div><span class="lnk" data-ext="${t.sym}">Open full quote on TradingView ›</span></div>`;}
};
function kpi(lab,val,cls,go){return `<div class="card kpi ${go?'clk':''}" ${go?`data-go="${go}"`:''}>${go?'<span class="hint">expand ›</span>':''}<div class="lab">${lab}</div><div class="val ${cls||''}">${val}</div></div>`;}
function back(){return '<span class="back" data-go="overview">‹ back to overview</span>';}
function emptyRow(n){return `<tr><td colspan="${n}" class="mut" style="text-align:center;padding:14px">No data yet.</td></tr>`;}
const content=document.getElementById('content');
function render(view,arg){content.innerHTML=(view==='ticker')?V.ticker(arg):V[view](DATA);document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===view));bind();}
function bind(){content.querySelectorAll('[data-go]').forEach(el=>el.onclick=e=>{e.stopPropagation();render(el.dataset.go);});content.querySelectorAll('.tk').forEach(el=>el.onclick=e=>{e.stopPropagation();render('ticker',el.dataset.tk);});content.querySelectorAll('[data-ext]').forEach(el=>el.onclick=()=>window.open('https://www.tradingview.com/symbols/'+el.dataset.ext+'/','_blank','noopener'));}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>render(t.dataset.tab));
document.getElementById('reload').onclick=load;
async function load(){try{DATA=await (await fetch('data/status.json?t='+Date.now())).json();}catch(e){document.getElementById('updated').textContent='waiting for first run…';DATA={};}document.getElementById('updated').textContent='updated '+(DATA.updated||'—');if(DATA.profile)document.getElementById('profile').textContent=DATA.profile;document.getElementById('regime').textContent='Regime: '+(DATA.regime||'—');document.getElementById('sampleBadge')&&(document.getElementById('sampleBadge').innerHTML=DATA.isSample?'<span class="sample">sample</span>':'');render('overview');}
load();
</script>
</body>
</html>
